<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo/icon-32.png" />
    <link rel="apple-touch-icon" href="/logo/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#5b2f12" />
    <meta name="description" content="Home-made Maharashtrian food for your family's occasions — pohe, modak, puran poli and more, cooked by Aji." />
    <title>Aji's Kitchen</title>
  </head>
  <body>
    <script>
      // Applies the saved theme before first paint, so dark mode never flashes white.
      try {
        var t = localStorage.getItem("aji-theme");
        if (t === "dark") {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
